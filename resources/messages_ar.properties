aboutText=\u062a\u0637\u0628\u064a\u0642 \u0631\u0633\u0645 \u0644\u0645\u0634\u0631\u0648\u0639 Java II \u2014 \u0627\u0644\u0645\u062f\u0631\u0633\u0629 \u0627\u0644\u0648\u0637\u0646\u064a\u0629 \u0644\u0644\u0639\u0644\u0648\u0645 \u0627\u0644\u062a\u0637\u0628\u064a\u0642\u064a\u0629 \u0628\u0622\u0633\u0641\u064a.\n\u0627\u0636\u063a\u0637 \u0632\u0631 \u0627\u0644\u0641\u0623\u0631\u0629 \u0627\u0644\u0623\u064a\u0633\u0631 \u0648\u0627\u0633\u062d\u0628 \u0644\u0644\u0631\u0633\u0645.\n\u064a\u0644\u063a\u064a Escape \u0627\u0644\u0631\u0633\u0645 \u0627\u0644\u062c\u0627\u0631\u064a. \u062a\u0631\u0633\u0645 \u0627\u0644\u0645\u0645\u062d\u0627\u0629 \u0628\u0627\u0644\u0644\u0648\u0646 \u0627\u0644\u0623\u0628\u064a\u0636.\n\u062a\u064f\u0639\u0631\u0636 \u0627\u0644\u0635\u0648\u0631 \u0627\u0644\u0634\u0641\u0627\u0641\u0629 \u0639\u0644\u0649 \u062e\u0644\u0641\u064a\u0629 \u0628\u064a\u0636\u0627\u0621.\n\u0627\u0644\u062d\u0641\u0638 \u0628\u0635\u064a\u063a\u0629 PNG\u061b \u0627\u0644\u0633\u062c\u0644 \u0645\u062d\u062f\u0648\u062f \u0628\u064020 \u062d\u0627\u0644\u0629 \u064864 \u0645\u064a\u0628\u064a\u0628\u0627\u064a\u062a.
